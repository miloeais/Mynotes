name: Build MyNotes APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/mynotes/app

          pip install Pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          image = Image.open("image_6291551a.jpg").convert("RGBA")

          for folder, size in sizes.items():
              path = f"app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)

              icon = ImageOps.fit(image, (size, size))
              icon.save(f"{path}/ic_launcher.png")

          PY

          cp index.html style.css app.js app/src/main/assets/
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyNotes"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mynotes.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mynotes.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="MyNotes"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mynotes/app/MainActivity.java <<'EOF'
          package com.mynotes.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.ValueCallback;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceResponse;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          import java.io.OutputStream;
          import java.io.IOException;
          import java.util.ArrayList;
          import android.util.Base64;

          public class MainActivity extends Activity {

          private WebView webView;

          private ValueCallback<Uri[]> filePathCallback;

          private static final int FILE_CHOOSER_REQUEST = 1001;
          private static final int SAVE_FILE_REQUEST = 1002;

          private byte[] pendingFileData;
          private String pendingMimeType;

          @Override
          protected void onCreate(Bundle savedInstanceState) {
          super.onCreate(savedInstanceState);

          webView = new WebView(this);
          setContentView(webView);

          webView.getSettings().setJavaScriptEnabled(true);
          webView.getSettings().setDomStorageEnabled(true);
          webView.getSettings().setAllowFileAccess(true);
 
           webView.addJavascriptInterface(
            new Object() {
                @JavascriptInterface
                public void saveFile(
                    String fileName,
                    String mimeType,
                    String base64Data
                ) {
                    try {
                        pendingFileData = Base64.decode(
                            base64Data,
                            Base64.DEFAULT
                        );

                        pendingMimeType = mimeType;

                        runOnUiThread(() -> {
                            Intent intent = new Intent(
                                Intent.ACTION_CREATE_DOCUMENT
                            );

                            intent.addCategory(
                                Intent.CATEGORY_OPENABLE
                            );

                            intent.setType(mimeType);
                            intent.putExtra(
                                Intent.EXTRA_TITLE,
                                fileName
                            );

                            startActivityForResult(
                                intent,
                                SAVE_FILE_REQUEST
                            );
                        });

                    } catch (Exception e) {
                        runOnUiThread(() ->
                            Toast.makeText(
                                MainActivity.this,
                                "Export failed",
                                Toast.LENGTH_SHORT
                            ).show()
                        );
                    }
                }
            },
            "MyNotes"
       );

         WebViewAssetLoader assetLoader =
            new WebViewAssetLoader.Builder()
                .addPathHandler(
                    "/assets/",
                    new WebViewAssetLoader.AssetsPathHandler(this)
                )
                .build();

        webView.setWebViewClient(new WebViewClientCompat() {
            @Override
            public WebResourceResponse shouldInterceptRequest(
                WebView view,
                WebResourceRequest request
            ) {
                return assetLoader.shouldInterceptRequest(
                    request.getUrl()
                );
            }
        });

        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public boolean onShowFileChooser(
                WebView view,
                ValueCallback<Uri[]> callback,
                FileChooserParams params
            ) {
                if (filePathCallback != null) {
                    filePathCallback.onReceiveValue(null);
                }

                filePathCallback = callback;

                Intent intent = params.createIntent();

                try {
                    startActivityForResult(
                        intent,
                        FILE_CHOOSER_REQUEST
                    );
                } catch (Exception e) {
                    filePathCallback = null;
                    return false;
                }

                return true;
            }
        });

        webView.loadUrl(
            "https://appassets.androidplatform.net/assets/index.html"
        );
        }

         @Override
        protected void onActivityResult(
        int requestCode,
        int resultCode,
        Intent data
       ) {
        super.onActivityResult(requestCode, resultCode, data);

        if (requestCode == FILE_CHOOSER_REQUEST) {

            if (filePathCallback != null) {

                Uri[] results = null;

                if (resultCode == Activity.RESULT_OK && data != null) {

                    if (data.getClipData() != null) {
                        int count = data.getClipData().getItemCount();

                        results = new Uri[count];

                        for (int i = 0; i < count; i++) {
                            results[i] =
                                data.getClipData().getItemAt(i).getUri();
                        }

                    } else if (data.getData() != null) {
                        results = new Uri[] { data.getData() };
                    }
                }

                filePathCallback.onReceiveValue(results);
                filePathCallback = null;
            }
        }

        if (requestCode == SAVE_FILE_REQUEST) {

            if (resultCode == Activity.RESULT_OK
                && data != null
                && data.getData() != null
                && pendingFileData != null) {

                try {
                    OutputStream output =
                        getContentResolver().openOutputStream(
                            data.getData()
                        );

                    if (output != null) {
                        output.write(pendingFileData);
                        output.close();

                        Toast.makeText(
                            this,
                            "File saved successfully",
                            Toast.LENGTH_SHORT
                        ).show();
                    }

                } catch (IOException e) {
                    Toast.makeText(
                        this,
                        "Could not save file",
                        Toast.LENGTH_SHORT
                    ).show();
                }
            }

            pendingFileData = null;
            pendingMimeType = null;
        }
       }

        @Override
        public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
       }
       }

          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyNotes-APK
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build MyNotes APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/mynotes/app

          cp index.html style.css app.js app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyNotes"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mynotes.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mynotes.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="MyNotes"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mynotes/app/MainActivity.java <<'EOF'
          package com.mynotes.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import android.webkit.WebResourceRequest;

          public class MainActivity extends android.app.Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);

                  WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build();

                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(
                              WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyNotes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
